<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Training Day — Bhavesh's Training Journal</title>
  <meta name="description" content="Day-by-day training log: DSA, full-stack, CS fundamentals, communication, and the daily scorecard.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← Back to all days</a>

    <header class="day-head" id="day-head">
      <div class="day-id">DAY</div>
      <h1>Loading…</h1>
      <div class="date"></div>
    </header>

    <div class="card" id="scorecard">
      <h2><span class="emoji">📊</span> Scorecard</h2>
      <p class="muted small">Loading…</p>
    </div>

    <div id="day-files"><p class="muted small">Loading day files…</p></div>

    <footer>
      <span class="inf">∞</span> Every day &gt;1% better than yesterday.
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
